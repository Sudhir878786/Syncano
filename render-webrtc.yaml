# Melodexa WebRTC Signaling Server - Render Deployment

version: 1

services:
  # Signaling Server (Node.js WebSocket)
  - type: web
    name: melodexa-signaling
    env: node
    region: oregon
    plan: free
    buildCommand: cd signaling-server && npm install
    startCommand: cd signaling-server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REDIS_URL
        sync: false  # Set in Render dashboard
      - key: CORS_ORIGIN
        value: https://melodexa.vercel.app,https://melodexa-*.vercel.app
    
  # Flask API Server (Music Service)
  - type: web
    name: melodexa-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: REDIS_URL
        sync: false  # Set in Render dashboard
      - key: SOCKETIO_CORS_ALLOWED_ORIGINS
        value: https://melodexa.vercel.app,https://melodexa-*.vercel.app
